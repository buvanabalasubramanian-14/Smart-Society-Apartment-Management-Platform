<!DOCTYPE html>
<html>
<head>
    <title>Resident Login | Smart Society</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="page">

    <div class="register-card">

        <div class="brand-section">

            <div class="logo">🏢</div>

            <h1>Smart Society</h1>

            <p class="brand-subtitle">
                Apartment Management Platform
            </p>

            <div class="brand-line"></div>

            <p class="brand-description">
                Access your resident account and manage
                your apartment services securely.
            </p>

            <div class="features">
                <div class="feature">
                    <span>✓</span>
                    <p>Resident Management</p>
                </div>

                <div class="feature">
                    <span>✓</span>
                    <p>Secure Login</p>
                </div>

                <div class="feature">
                    <span>✓</span>
                    <p>Society Services</p>
                </div>
            </div>

        </div>

        <div class="form-section">

            <div class="form-header">
                <h2>Resident Login</h2>
                <p>Sign in to access your account</p>
            </div>

            <form method="POST" action="/login">

                <div class="input-group">
                    <label>Email Address</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required>
                </div>

                <div class="input-group">
                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="6-character password"
                        minlength="6"
                        maxlength="6"
                        required>
                </div>

                <button type="submit" class="create-btn">
                    Sign In
                </button>

            </form>

            <div class="login-link">
                Don't have an account?
                <a href="/register">Create Account</a>
            </div>

            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

</body>
</html>
