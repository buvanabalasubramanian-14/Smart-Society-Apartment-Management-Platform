<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Smart Society</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page"><div class="register-card">

<div class="brand-section">
<div class="logo">🛡️</div>
<h1>Smart Society</h1>
<p class="brand-subtitle">Society Management Platform</p>
<div class="brand-line"></div>
<p class="brand-description">Manage residents, complaints and apartment services from the administration panel.</p>
<div class="features">
<div class="feature"><span>✓</span><p>Resident Management</p></div>
<div class="feature"><span>✓</span><p>Complaint Management</p></div>
<div class="feature"><span>✓</span><p>Society Administration</p></div>
</div></div>

<div class="form-section">
<div class="form-header"><h2>Admin Login</h2><p>Sign in to manage the society</p></div>
<form method="POST" action="/admin/login">
<div class="input-group"><label>Email Address</label><input type="email" name="email" placeholder="admin@smartsociety.com" required></div>
<div class="input-group"><label>Password</label><input type="password" name="password" placeholder="Enter admin password" required></div>
<button type="submit" class="create-btn">Admin Sign In</button>
</form>
<div class="login-link">Resident? <a href="/login">Resident Login</a></div>
</div>

</div></div>
</body>
</html>
