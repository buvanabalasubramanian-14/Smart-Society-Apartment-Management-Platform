<!DOCTYPE html>
<html>
<head>
    <title>Resident Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .header,
        .profile-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .profile-card {
            margin-top: 25px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
        }

        .info {
            padding: 15px;
            margin-top: 12px;
            background: #f5f7fb;
            border-radius: 10px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Resident Profile</h1>
        <p class="subtitle">
            View your apartment resident information.
        </p>
    </div>

    <div class="profile-card">

        <h2>My Information</h2>

        <div class="info">
            <strong>Name</strong>
            <p>{{ resident.name }}</p>
        </div>

        <div class="info">
            <strong>Flat Number</strong>
            <p>{{ resident.flat_no }}</p>
        </div>

        <div class="info">
            <strong>Phone</strong>
            <p>{{ resident.phone }}</p>
        </div>

        <div class="info">
            <strong>Email</strong>
            <p>{{ resident.email }}</p>
        </div>

    </div>

    <a class="back" href="/dashboard">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
