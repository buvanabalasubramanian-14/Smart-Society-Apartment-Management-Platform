<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resident Registration | Smart Society</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="page">

    <div class="register-card">


        <!-- LEFT SIDE -->

        <div class="brand-section">

            <div class="logo">
                🏢
            </div>

            <h1>
                Smart Society
            </h1>

            <p class="brand-subtitle">
                Apartment Management Platform
            </p>

            <div class="brand-line"></div>

            <p class="brand-description">
                A simple and secure platform for managing
                your apartment community.
            </p>


            <div class="features">

                <div class="feature">
                    <span>✓</span>
                    <p>Resident Management</p>
                </div>

                <div class="feature">
                    <span>✓</span>
                    <p>Secure Login</p>
                </div>

                <div class="feature">
                    <span>✓</span>
                    <p>Society Services</p>
                </div>

            </div>

        </div>



        <!-- RIGHT SIDE -->

        <div class="form-section">

            <div class="form-header">

                <h2>
                    Create Resident Account
                </h2>

                <p>
                    Enter your details to get started
                </p>

            </div>


            <form method="POST"
                  action="/register">


                <!-- NAME -->

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        pattern="[A-Za-z ]+"
                        title="Name must contain letters and spaces only"
                        oninput="this.value = this.value.replace(/[^A-Za-z ]/g, '')"
                        required>

                </div>



                <!-- FLAT NUMBER -->

                <div class="input-group">

                    <label for="flat_no">
                        Flat Number
                    </label>

                    <input
                        type="text"
                        id="flat_no"
                        name="flat_no"
                        placeholder="Example: A-101"
                        maxlength="10"
                        title="Flat number must not exceed 10 characters"
                        required>

                </div>



                <!-- PHONE -->

                <div class="input-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="10-digit phone number"
                        inputmode="numeric"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)"
                        title="Phone number must contain exactly 10 digits"
                        required>

                </div>



                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        maxlength="100"
                        required>

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter exactly 6 characters"
                        minlength="6"
                        maxlength="6"
                        title="Password must be exactly 6 characters"
                        required>

                </div>



                <!-- BUTTON -->

                <button
                    type="submit"
                    class="create-btn">

                    Create Account

                </button>

            </form>



            <div class="login-link">

                Already have an account?

                <a href="/login">
                    Sign in
                </a>

            </div>



            <a href="/"
               class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>

</div>


</body>

</html>
